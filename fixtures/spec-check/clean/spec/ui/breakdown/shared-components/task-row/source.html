<!-- task-row — verbatim region `ul.tasks > li` of the mock, two states -->
<!-- open -->
<li class="task-row flex items-center gap-2 py-1">
  <label class="flex items-center gap-2"><input type="checkbox" class="checkbox checkbox-sm"> <span class="task-title">Buy milk</span></label>
  <time class="text-xs opacity-60 ml-auto">09:00</time>
</li>
<!-- done -->
<li class="task-row flex items-center gap-2 py-1 line-through">
  <label class="flex items-center gap-2"><input type="checkbox" class="checkbox checkbox-sm" checked> <span class="task-title">Walk the dog</span></label>
  <time class="text-xs opacity-60 ml-auto">08:15</time>
</li>
