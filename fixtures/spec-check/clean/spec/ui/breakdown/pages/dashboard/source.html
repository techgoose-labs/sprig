<!-- dashboard — verbatim `main` at #/ -->
<main class="p-4">
  <h1 class="text-2xl">Open tasks</h1>
  <div class="stat bg-base-100 rounded-box shadow">
    <div class="stat-title">Open</div>
    <div class="stat-value tabular-nums">12</div>
    <div class="stat-desc"><span class="badge badge-primary badge-sm">3 new</span></div>
  </div>
  <ul class="tasks">
    <li class="task-row flex items-center gap-2 py-1">
      <label class="flex items-center gap-2"><input type="checkbox" class="checkbox checkbox-sm"> <span class="task-title">Buy milk</span></label>
      <time class="text-xs opacity-60 ml-auto">09:00</time>
    </li>
  </ul>
</main>
