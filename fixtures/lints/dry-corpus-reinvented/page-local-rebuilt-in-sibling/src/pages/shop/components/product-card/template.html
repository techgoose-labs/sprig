<article class="card bg-base-100 border">
  <figure><img [src]="image" [alt]="name" /></figure>
  <div class="card-body">
    <h2 class="card-title">{{ name }}</h2>
    <div class="flex items-baseline gap-2">
      <span class="text-2xl font-bold tabular-nums">{{ price }}</span>
      <span class="text-sm line-through text-base-content/50">{{ was }}</span>
      <span class="badge badge-accent badge-sm">{{ off }}</span>
    </div>
  </div>
</article>
