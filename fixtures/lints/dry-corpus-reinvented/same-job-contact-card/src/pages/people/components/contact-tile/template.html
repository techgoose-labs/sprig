<article class="card card-side bg-base-200">
  <figure class="p-4"><img class="w-16 mask mask-squircle" [src]="avatar" [alt]="name" /></figure>
  <section class="card-body p-4">
    <h3 class="card-title">{{ name }}</h3>
    <dl class="text-sm"><dt>Email</dt><dd>{{ email }}</dd><dt>Phone</dt><dd>{{ phone }}</dd></dl>
  </section>
</article>
