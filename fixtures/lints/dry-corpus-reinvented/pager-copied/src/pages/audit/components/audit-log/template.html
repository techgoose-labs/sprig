<div class="flex flex-col gap-4">
  <ul class="list">@for (e of entries(); track e.id) {<li class="list-row">{{ e.text }}</li>}</ul>
  <div class="join self-center">
    <button class="join-item btn btn-sm" [disabled]="page() <= 1" (click)="back()">«</button>
    <button class="join-item btn btn-sm btn-active">{{ page() }}</button>
    <button class="join-item btn btn-sm" [disabled]="page() >= total()" (click)="forward()">»</button>
  </div>
</div>
