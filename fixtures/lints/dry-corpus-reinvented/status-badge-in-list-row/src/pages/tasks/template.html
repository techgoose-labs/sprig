<main class="p-6">
  <ul class="list bg-base-100">
    @for (t of tasks; track t.id) {
    <li class="list-row items-center">
      <span class="font-medium">{{ t.title }}</span>
      @if (t.late) {
      <span class="badge badge-soft badge-error gap-1 whitespace-nowrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="size-5"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span>Late</span></span>
      }
    </li>
    }
  </ul>
</main>
