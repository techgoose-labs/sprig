<article class="card bg-base-100 border">
  <figure class="aspect-square"><img class="object-cover w-full" [src]="photo" [alt]="name" /></figure>
  <div class="card-body p-3">
    <h3 class="card-title text-base">{{ name }}</h3>
    <p class="text-sm">{{ breed }} · kennel {{ kennel }}</p>
  </div>
</article>
