<main class="board-main max-w-7xl mx-auto p-3 md:p-6">
  @if (loadState === 'loading') {
  <div class="board-loading" aria-busy="true">
    <div class="board-skel-strip grid grid-cols-2 md:grid-cols-4 gap-3 mb-6" aria-hidden="true">
      <div class="skeleton board-skel h-20 rounded-box"></div>
      <div class="skeleton board-skel h-20 rounded-box"></div>
      <div class="skeleton board-skel h-20 rounded-box"></div>
      <div class="skeleton board-skel h-20 rounded-box"></div>
    </div>
    <div class="board-loading-note flex items-center gap-2 mb-4" role="status"><span class="loading loading-spinner loading-sm board-spinner" aria-hidden="true"></span>Loading today's dogs…</div>
    <div class="board-skel-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
      <skeleton-card></skeleton-card>
    </div>
  </div>
  } @else {
  @if (loadState === 'error' || !today) {
  <div class="board-error mt-10">
    <load-error title="Couldn't load today's board" message="The kennel server didn't answer. Your last check-ins are safe — nothing was lost." retryLabel="Retry"></load-error>
  </div>
  } @else {
  <div class="board-head flex flex-wrap items-end justify-between gap-2 mb-4">
    <div>
      <h1 class="board-title text-4xl">Today's dogs</h1>
      <p class="board-date">{{ dayLabel }}</p>
    </div>
    @if (today.closed) {
    <icon-badge icon="lock" tone="neutral" [soft]="false" size="md" label="Day closed" focusId=""></icon-badge>
    }
  </div>
  <status-strip [booked]="today.byStatus.booked" [checkedIn]="today.byStatus['checked-in']" [walking]="today.byStatus.walking" [checkedOut]="today.byStatus['checked-out']" [empty]="(!status || status === 'all') && (!dogList || dogList.length === 0)" [active]="status ? status : 'all'"></status-strip>
  <status-filter-tabs [status]="status ? status : 'all'"></status-filter-tabs>
  <dog-grid [status]="status ? status : 'all'" [dogs]="dogList ? dogList : []"></dog-grid>
  }
  }
</main>
