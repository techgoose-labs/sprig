<section class="dog-profile-card card bg-base-100 border border-base-300" aria-labelledby="dog-profile-card-title">
  <div class="card-body">
    <h2 id="dog-profile-card-title" class="dog-profile-card-title card-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="dog-profile-card-icon"><circle cx="11" cy="4" r="2"></circle><circle cx="18" cy="8" r="2"></circle><circle cx="20" cy="16" r="2"></circle><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"></path></svg>The dog
    </h2>
    <dl class="dog-profile-card-facts">
      <dt class="dog-profile-card-term">Breed</dt><dd>{{ breed }}</dd>
      <dt class="dog-profile-card-term">Kennel</dt><dd><span class="dog-profile-card-kennel badge badge-outline">{{ kennel }}</span></dd>
      <dt class="dog-profile-card-term">Arrival</dt><dd class="dog-profile-card-num">{{ arrival }}</dd>
      <dt class="dog-profile-card-term">Owner</dt><dd>{{ ownerName }}</dd>
      <dt class="dog-profile-card-term">Phone</dt><dd class="dog-profile-card-num">{{ ownerPhone }}</dd>
    </dl>
  </div>
</section>
