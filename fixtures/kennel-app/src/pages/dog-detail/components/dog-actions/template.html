<section class="card bg-base-100 border border-base-300 dog-actions-card" aria-labelledby="dog-actions-title">
  <div class="card-body">
    <h2 id="dog-actions-title" class="card-title dog-actions-title"><svg class="dog-actions-title-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg>Actions</h2>
    @if (closed()) {
    <p id="dog-actions-locked-note" class="dog-actions-locked-note">The day is closed — stays are locked.</p>
    }
    <div class="dog-actions-list" [attr.aria-busy]="inFlight() ? 'true' : null" [attr.aria-describedby]="closed() ? 'dog-actions-locked-note' : null">
      <button type="button" id="check-in" data-cmd="dog.checkIn" class="btn dog-actions-btn" [class.btn-primary]="primary('dog.checkIn')" [class.btn-soft]="!primary('dog.checkIn')" [class.btn-secondary]="!primary('dog.checkIn')" [disabled]="!offered('dog.checkIn')" (click)="act('dog.checkIn')"><svg class="dog-actions-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>Check in</button>
      <button type="button" id="start-walk" data-cmd="dog.startWalk" class="btn btn-soft btn-secondary dog-actions-btn" [disabled]="!offered('dog.startWalk')" (click)="act('dog.startWalk')"><svg class="dog-actions-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>Start walk</button>
      <button type="button" id="end-walk" data-cmd="dog.endWalk" class="btn btn-soft btn-secondary dog-actions-btn" [disabled]="!offered('dog.endWalk')" (click)="act('dog.endWalk')"><svg class="dog-actions-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>End walk</button>
      <button type="button" id="check-out" data-cmd="dog.checkOut" class="btn dog-actions-btn" [class.btn-primary]="primary('dog.checkOut')" [class.btn-soft]="!primary('dog.checkOut')" [class.btn-secondary]="!primary('dog.checkOut')" [disabled]="!offered('dog.checkOut')" (click)="act('dog.checkOut')"><svg class="dog-actions-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>Check out</button>
    </div>
  </div>
</section>
