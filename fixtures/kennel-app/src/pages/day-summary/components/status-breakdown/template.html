<section class="status-breakdown card bg-base-100 border border-base-300" aria-labelledby="status-breakdown-title">
  <div class="card-body">
    <h2 id="status-breakdown-title" class="status-breakdown-title card-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="status-breakdown-icon"><path d="M11.25 16.25h1.5L12 17z"></path><path d="M16 14v.5"></path><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"></path><path d="M8 14v.5"></path><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"></path></svg>Dogs by status
    </h2>
    <ul class="status-breakdown-rows" role="list">
      <li class="status-breakdown-row" data-status="booked">
        <span class="status-breakdown-badge"><status-badge status="booked" size="sm"></status-badge></span>
        <progress class="status-breakdown-bar progress progress-info" [attr.value]="booked" [attr.max]="kennelsTotal" [attr.aria-label]="'Booked: ' + booked + ' of ' + kennelsTotal + ' kennels'"></progress>
        <span class="status-breakdown-count">{{ booked }}</span>
      </li>
      <li class="status-breakdown-row" data-status="checked-in">
        <span class="status-breakdown-badge"><status-badge status="checked-in" size="sm"></status-badge></span>
        <progress class="status-breakdown-bar progress progress-success" [attr.value]="checkedIn" [attr.max]="kennelsTotal" [attr.aria-label]="'Checked in: ' + checkedIn + ' of ' + kennelsTotal + ' kennels'"></progress>
        <span class="status-breakdown-count">{{ checkedIn }}</span>
      </li>
      <li class="status-breakdown-row" data-status="walking">
        <span class="status-breakdown-badge"><status-badge status="walking" size="sm"></status-badge></span>
        <progress class="status-breakdown-bar progress progress-accent" [attr.value]="walking" [attr.max]="kennelsTotal" [attr.aria-label]="'Walking: ' + walking + ' of ' + kennelsTotal + ' kennels'"></progress>
        <span class="status-breakdown-count">{{ walking }}</span>
      </li>
      <li class="status-breakdown-row" data-status="checked-out">
        <span class="status-breakdown-badge"><status-badge status="checked-out" size="sm"></status-badge></span>
        <progress class="status-breakdown-bar progress" [attr.value]="checkedOut" [attr.max]="kennelsTotal" [attr.aria-label]="'Checked out: ' + checkedOut + ' of ' + kennelsTotal + ' kennels'"></progress>
        <span class="status-breakdown-count">{{ checkedOut }}</span>
      </li>
    </ul>
  </div>
</section>
