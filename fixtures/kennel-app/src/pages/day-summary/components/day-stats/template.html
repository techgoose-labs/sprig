<div class="stats stats-vertical md:stats-horizontal w-full bg-base-100 border border-base-300 day-stats-region">
  <div class="stat day-stats-occupancy">
    <div class="stat-figure text-secondary"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="warehouse" class="lucide lucide-warehouse size-8"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"></path><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"></path><path d="M6 13h12"></path><path d="M6 17h12"></path></svg></div>
    <div class="stat-title">Occupancy</div>
    <div class="stat-value tabular-nums">{{ used() }}<span class="text-base font-normal text-base-content/60">{{ " of " + capacity() + " kennels" }}</span></div>
    <div class="stat-desc"><progress class="progress progress-secondary w-40" aria-label="Occupancy" [attr.value]="pct()" max="100"></progress> {{ pct() }}%</div>
  </div>
  <div class="stat day-stats-revenue">
    <div class="stat-figure text-success"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="banknote" class="lucide lucide-banknote size-8"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg></div>
    <div class="stat-title">Revenue today</div>
    <div class="stat-value tabular-nums">{{ revenue() }}</div>
    <div class="stat-desc day-stats-revenue-desc" aria-live="polite">{{ isClosed() ? "Final" : "Settles when the day closes" }}</div>
  </div>
  <div class="stat day-stats-overdue">
    <div class="stat-figure text-error"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="alarm-clock" class="lucide lucide-alarm-clock size-8"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M5 3 2 6"></path><path d="m22 6-3-3"></path><path d="M6.38 18.7 4 21"></path><path d="M17.64 18.67 20 21"></path></svg></div>
    <div class="stat-title">Overdue pickups</div>
    <div class="stat-value tabular-nums">{{ overdue() }}</div>
    <div class="stat-desc">Past their planned check-out</div>
  </div>
</div>
