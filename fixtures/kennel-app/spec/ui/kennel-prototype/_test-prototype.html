<!doctype html>
<html lang="en" data-theme="brand">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kennel board — prototype</title>
  <!-- CDN stack: daisyUI (components) + Tailwind browser (layout) + Lucide (icons). Both CSS tags required. -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
/* =========================================================================
   Hearth Design System — theme.cdn.css
   -------------------------------------------------------------------------
   DERIVED from theme.css — do NOT hand-edit. Regenerate when theme.css changes.

   The flattened [data-theme] twin the `prototype` skill pastes inline (no build
   step). daisyUI v5 reads the --color-* variables at runtime, so components
   retheme with no compiler. Values are byte-identical to theme.css.

   Paste the entire contents into a <style> in <head>, then set
   <html data-theme="brand"> (or "brand-dark").
   ========================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap');

/* ---- Brand theme · light (default) ------------------------------------ */
[data-theme="brand"] {
  color-scheme: light;

  --color-base-100: #FBF7F0; /* warm cream — page surface       */
  --color-base-200: #F3EADB; /* deeper cream — elevation / hover */
  --color-base-300: #E6D7C3; /* warm tan — borders / dividers    */
  --color-base-content: #3B2A1E; /* espresso brown — body + headings */

  --color-primary: #C2410C; /* terracotta — the one precious CTA */
  --color-primary-content: #FFF8F1;
  --color-secondary: #5E6B47; /* sage — calm, affirmative support  */
  --color-secondary-content: #FBF7F0;
  --color-accent: #DA9A3E; /* honey gold — decorative warmth    */
  --color-accent-content: #3B2A1E;
  --color-neutral: #43342A; /* warm dark brown — structural      */
  --color-neutral-content: #FBF3E9;

  --color-info: #3F7E8C;
  --color-info-content: #FBF7F0; /* muted teal */
  --color-success: #4E7A2F;
  --color-success-content: #FBF7F0; /* leaf green */
  --color-warning: #D97706;
  --color-warning-content: #3B2A1E; /* warm amber */
  --color-error: #C0392B;
  --color-error-content: #FFF6F4; /* brick red  */

  --radius-selector: 1rem;
  --radius-field: 0.75rem;
  --radius-box: 1.25rem;
  --size-selector: 0.25rem;
  --size-field: 0.25rem;
  --border: 1px;
  --depth: 1;
  --noise: 1;
}

/* ---- Brand theme · dark ----------------------------------------------- */
[data-theme="brand-dark"] {
  color-scheme: dark;

  --color-base-100: #1E1712; /* warm near-black espresso */
  --color-base-200: #29201A;
  --color-base-300: #3A2E24;
  --color-base-content: #F1E7D9; /* warm cream ink */

  --color-primary: #EA7A45;
  --color-primary-content: #2A1206; /* brighter terracotta */
  --color-secondary: #93A179;
  --color-secondary-content: #1B1611; /* lifted sage */
  --color-accent: #E8B25E;
  --color-accent-content: #2A1F0E; /* lifted honey */
  --color-neutral: #2C231C;
  --color-neutral-content: #F1E7D9;

  --color-info: #5FA6B5;
  --color-info-content: #0E1B1E;
  --color-success: #84B85A;
  --color-success-content: #14210C;
  --color-warning: #E8A53E;
  --color-warning-content: #2A1E08;
  --color-error: #E06A5C;
  --color-error-content: #2A0E0A;

  --radius-selector: 1rem;
  --radius-field: 0.75rem;
  --radius-box: 1.25rem;
  --size-selector: 0.25rem;
  --size-field: 0.25rem;
  --border: 1px;
  --depth: 1;
  --noise: 1;
}

/* ---- Non-color layer (theme-independent) ------------------------------
   display = Caveat (warm handwritten script — the hand-made voice)
   body    = Quicksand (clean geometric rounded sans — readable & friendly) */
:root {
  --font-display: 'Caveat', 'Comic Sans MS', system-ui, cursive;
  --font-body: 'Quicksand', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;

  /* Modular type scale — major-third (1.25), base 16px */
  --step--2: 0.64rem; /* 10.2px — fine print          */
  --step--1: 0.8rem; /* 12.8px — captions / labels   */
  --step-0: 1rem; /* 16px   — body                */
  --step-1: 1.25rem; /* 20px   — lead / large body   */
  --step-2: 1.5625rem; /* 25px   — h4                  */
  --step-3: 1.9531rem; /* 31px   — h3                  */
  --step-4: 2.4414rem; /* 39px   — h2                  */
  --step-5: 3.0518rem; /* 49px   — h1 / hero wordmark  */

  /* Line-height + tracking that travel with the scale */
  --leading-tight: 1.1;
  --leading-snug: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;
  --tracking-display: -0.015em;
  --measure: 65ch;

  /* Motion — gentle, with a warm little bounce on welcome */
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-standard: cubic-bezier(0.20, 0, 0, 1);
  --dur-micro: 120ms;
  --dur-fast: 200ms;
  --dur-base: 320ms;

  /* Derived shade tokens (build-free; charts & subtle fills read these) */
  --color-base-content-30: color-mix(in oklch, var(--color-base-content) 30%, transparent);
  --color-base-content-50: color-mix(in oklch, var(--color-base-content) 50%, transparent);
  --color-primary-30: color-mix(in oklch, var(--color-primary) 30%, transparent);
  --color-primary-15: color-mix(in oklch, var(--color-primary) 15%, transparent);
  --color-secondary-30: color-mix(in oklch, var(--color-secondary) 30%, transparent);
  --color-accent-30: color-mix(in oklch, var(--color-accent) 30%, transparent);
}

body {
  font-family: var(--font-body);
}
h1,
h2,
h3,
h4,
.font-display {
  font-family: var(--font-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
}

/* Caveat is a script: it carries little weight contrast, so headings want a
   heavier weight to read as headings. */
h1,
h2,
h3,
h4,
.font-display {
  font-weight: 700;
}

/* A warm welcome: new guestbook entries rise gently into place. */
@keyframes brand-rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.animate-rise {
  animation: brand-rise var(--dur-base) var(--ease-bounce) both;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

  </style>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <!-- ============ Top bar ============ -->
  <header class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-30 px-3 md:px-6 gap-2">
    <div class="flex-1 flex items-center gap-2 min-w-0">
      <i data-lucide="dog" class="size-6 text-primary shrink-0"></i>
      <a href="#/board" class="font-display text-2xl md:text-3xl truncate pr-2">Kennel board</a>
    </div>
    <nav class="flex items-center gap-1">
      <a href="#/board" data-nav="board" class="btn btn-ghost btn-sm">
        <i data-lucide="layout-grid" class="size-[1.2em]"></i><span class="hidden sm:inline">Board</span>
      </a>
      <a href="#/summary" data-nav="summary" class="btn btn-ghost btn-sm">
        <i data-lucide="chart-no-axes-column" class="size-[1.2em]"></i><span class="hidden sm:inline">Day summary</span>
      </a>
      <label class="swap swap-rotate btn btn-ghost btn-sm btn-square" title="Toggle theme">
        <input type="checkbox" id="theme-toggle" />
        <i data-lucide="sun" class="swap-off size-[1.2em]"></i>
        <i data-lucide="moon" class="swap-on size-[1.2em]"></i>
      </label>
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-sm btn-square" title="Demo states">
          <i data-lucide="flask-conical" class="size-[1.2em]"></i>
        </div>
        <div tabindex="0" class="dropdown-content z-40 mt-2 w-60 rounded-box bg-base-100 border border-base-300 shadow-sm p-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Demo states</legend>
            <select id="demo-state" class="select select-sm w-full">
              <option value="live">Live (seed data — 32 dogs)</option>
              <option value="empty">Empty — no dogs today</option>
              <option value="loading">Loading</option>
              <option value="error">Error — load failed</option>
            </select>
            <label class="label mt-2 cursor-pointer gap-2">
              <input type="checkbox" id="demo-fail" class="toggle toggle-sm toggle-error" />
              Next write fails
            </label>
            <p class="label text-xs whitespace-normal">A failing write rolls back and shows an error toast.</p>
          </fieldset>
        </div>
      </div>
    </nav>
  </header>

  <main id="app" class="max-w-7xl mx-auto p-3 md:p-6"></main>

  <div id="toasts" class="toast toast-end toast-bottom z-50 mb-12"></div>

<script>
// ---------------------------------------------------------------------------
// Presentation only. Reads go through window.objects, writes through
// window.commands (both injected by the host). No data lives in this file.
// ---------------------------------------------------------------------------
const STATUS = {
  "booked":      { label: "Booked",      badge: "badge-info badge-soft",     icon: "calendar-clock" },
  "checked-in":  { label: "Checked in",  badge: "badge-success badge-soft",  icon: "house" },
  "walking":     { label: "Walking",     badge: "badge-accent",              icon: "footprints" },
  "checked-out": { label: "Checked out", badge: "badge-outline", icon: "log-out" },
};
const ORDER = ["booked", "checked-in", "walking", "checked-out"];

const params = new URLSearchParams(location.search);
const ui = {
  demo: params.get("state") || "live",
  failNext: false,
  filter: "all",
  data: null,          // { dog, owner, stay, day } as returned by the read seam
  pendingClose: false,
};

const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);
const when = (iso) => new Date(iso + "Z").toLocaleString("en-US", { timeZone: "UTC", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const dayLabel = (iso) => new Date(iso + "T12:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" });
const badge = (status, extra = "") => {
  const s = STATUS[status];
  return `<span class="badge ${s.badge} ${extra} whitespace-nowrap"><i data-lucide="${s.icon}" class="size-[1em]"></i>${s.label}</span>`;
};
const overdueBadge = (d) => d.overdue
  ? `<span class="badge badge-error whitespace-nowrap"><i data-lucide="alarm-clock" class="size-[1em]"></i>Overdue${d.overdueBy ? " · " + esc(d.overdueBy) : ""}</span>` : "";
const owner = (id) => ui.data.owner.find((o) => o.id === id) || { name: "Unknown owner" };
const stayOf = (dogId) => ui.data.stay.find((s) => s.dog === dogId);

function toast(msg, kind = "error") {
  const el = document.createElement("div");
  el.className = `alert alert-${kind} shadow-sm max-w-xs`;
  el.innerHTML = `<i data-lucide="${kind === "error" ? "circle-alert" : "circle-check"}" class="size-5 shrink-0"></i><span>${esc(msg)}</span>`;
  document.getElementById("toasts").appendChild(el);
  lucide.createIcons();
  setTimeout(() => el.remove(), 3500);
}

// ---------------------------------------------------------------------------
// Loading (with the demo-state overrides — faked in the view layer only).
// ---------------------------------------------------------------------------
async function load() {
  if (ui.demo === "loading") return "loading";
  if (ui.demo === "error") return "error";
  const [dog, owner, stay, day] = await Promise.all(["dog", "owner", "stay", "day"].map((t) => window.objects.all(t)));
  ui.data = { dog, owner, stay, day: day[0] };
  if (ui.demo === "empty") ui.data = { ...ui.data, dog: [], stay: [] };
  return "ok";
}

// ---------------------------------------------------------------------------
// Unglamorous states.
// ---------------------------------------------------------------------------
const skeletonCards = (n) => Array.from({ length: n }, () => `
  <div class="card bg-base-100 border border-base-300"><div class="card-body gap-3">
    <div class="skeleton h-6 w-2/3"></div><div class="skeleton h-4 w-1/2"></div>
    <div class="flex gap-2"><div class="skeleton h-5 w-20"></div><div class="skeleton h-5 w-14"></div></div>
  </div></div>`).join("");

function renderLoading() {
  $app.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">${Array.from({ length: 4 }, () => `<div class="skeleton h-20 rounded-box"></div>`).join("")}</div>
    <div class="flex items-center gap-2 mb-4 text-base-content/70"><span class="loading loading-spinner loading-sm"></span>Loading today's dogs…</div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${skeletonCards(8)}</div>`;
}

function renderError() {
  $app.innerHTML = `
    <div role="alert" class="alert alert-error alert-soft max-w-2xl mx-auto mt-10">
      <i data-lucide="wifi-off" class="size-6 shrink-0"></i>
      <div><h3 class="font-bold">Couldn't load today's board</h3>
        <div class="text-sm">The kennel server didn't answer. Your last check-ins are safe — nothing was lost.</div></div>
      <button class="btn btn-sm" onclick="setDemo('live')">Retry</button>
    </div>`;
}

// ---------------------------------------------------------------------------
// Screen 1 — Board.
// ---------------------------------------------------------------------------
function statusStrip() {
  const bs = ui.data.day.byStatus;
  const empty = ui.data.dog.length === 0;
  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">` + ORDER.map((s) => `
    <button data-filter="${s}" class="card bg-base-100 border ${ui.filter === s ? "border-primary" : "border-base-300"} text-left hover:bg-base-200 transition-colors">
      <div class="card-body p-4 gap-1">
        <div class="flex items-center justify-between gap-2">${badge(s, "badge-sm")}</div>
        <div class="text-3xl font-semibold tabular-nums">${empty ? "—" : esc(bs[s])}</div>
      </div>
    </button>`).join("") + `</div>`;
}

function dogCard(d) {
  const o = owner(d.owner);
  return `
  <a href="#/dog/${esc(d.id)}" class="card bg-base-100 border ${d.overdue ? "border-error" : "border-base-300"} hover:shadow-sm transition-shadow min-w-0">
    <div class="card-body p-4 gap-2">
      <div class="flex items-start justify-between gap-2 min-w-0">
        <h2 class="card-title text-2xl leading-tight min-w-0 break-words">${esc(d.name)}</h2>
        <span class="badge badge-outline font-mono shrink-0">${esc(d.kennel)}</span>
      </div>
      <p class="text-sm text-base-content/70 truncate">${esc(d.breed)}</p>
      <p class="text-sm flex items-center gap-1 min-w-0"><i data-lucide="user" class="size-4 shrink-0"></i><span class="truncate">${esc(o.name)}</span></p>
      <div class="flex flex-wrap items-center gap-2 mt-1">
        ${badge(d.status)} ${overdueBadge(d)}
        <span class="ml-auto text-sm text-base-content/70 flex items-center gap-1 tabular-nums"><i data-lucide="clock" class="size-4"></i>${esc(d.arrival)}</span>
      </div>
    </div>
  </a>`;
}

function renderBoard() {
  const { day, dog } = ui.data;
  const shown = ui.filter === "all" ? dog : dog.filter((d) => d.status === ui.filter);
  const tabs = ["all", ...ORDER].map((f) => `
    <button role="tab" data-filter="${f}" class="tab whitespace-nowrap ${ui.filter === f ? "tab-active" : ""}">${f === "all" ? "All" : STATUS[f].label}</button>`).join("");
  let list;
  if (dog.length === 0) {
    list = `<div class="card bg-base-100 border border-dashed border-base-300"><div class="card-body items-center text-center py-16">
      <i data-lucide="bone" class="size-10 text-base-content/40"></i>
      <h2 class="font-display text-3xl">No dogs booked today</h2>
      <p class="text-base-content/70 max-w-sm">When a booking lands for today it shows up here, ready to check in.</p></div></div>`;
  } else if (shown.length === 0) {
    list = `<div class="card bg-base-100 border border-dashed border-base-300"><div class="card-body items-center text-center py-12">
      <i data-lucide="search-x" class="size-8 text-base-content/40"></i>
      <p class="text-base-content/70">No dogs are <b>${STATUS[ui.filter].label.toLowerCase()}</b> right now.</p>
      <button class="btn btn-sm btn-ghost" data-filter="all">Show all dogs</button></div></div>`;
  } else {
    list = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${shown.map(dogCard).join("")}</div>`;
  }
  $app.innerHTML = `
    <div class="flex flex-wrap items-end justify-between gap-2 mb-4">
      <div><h1 class="font-display text-4xl">Today's dogs</h1>
        <p class="text-base-content/70">${esc(dayLabel(day.date))}</p></div>
      ${day.closed ? `<span class="badge badge-neutral"><i data-lucide="lock" class="size-[1em]"></i>Day closed</span>` : ""}
    </div>
    ${statusStrip()}
    <div role="tablist" class="tabs tabs-box mb-4 overflow-x-auto flex-nowrap">${tabs}</div>
    ${list}`;
}

// ---------------------------------------------------------------------------
// Screen 2 — Dog detail.
// ---------------------------------------------------------------------------
function renderDetail(id) {
  const d = ui.data.dog.find((x) => x.id === id);
  if (!d) {
    $app.innerHTML = `<div class="card bg-base-100 border border-base-300 max-w-xl mx-auto mt-10"><div class="card-body items-center text-center">
      <i data-lucide="dog" class="size-10 text-base-content/40"></i>
      <h1 class="font-display text-3xl">We can't find that dog</h1>
      <p class="text-base-content/70">It may have been removed from today's board.</p>
      <a href="#/board" class="btn btn-sm">Back to the board</a></div></div>`;
    return;
  }
  const o = owner(d.owner);
  const st = stayOf(d.id);
  const locked = ui.data.day.closed;
  const act = (cmd, label, icon, enabled, primary = false) => `
    <button data-cmd="${cmd}" class="btn ${primary ? "btn-primary" : "btn-soft btn-secondary"} w-full sm:w-auto" ${enabled && !locked ? "" : "disabled"}>
      <i data-lucide="${icon}" class="size-[1.2em]"></i>${label}</button>`;
  const notes = d.notes.length === 0
    ? `<li class="text-base-content/60 italic py-3">No notes yet — add the first one below.</li>`
    : d.notes.map((n) => `
      <li class="py-3 ${n.pending ? "opacity-50" : ""}">
        <p class="break-words">${esc(n.text)}</p>
        <p class="text-xs text-base-content/60 mt-1">${esc(n.author)} · ${n.pending ? "saving…" : n.at ? esc(when(n.at)) : "just now"}</p>
      </li>`).join("");
  $app.innerHTML = `
    <a href="#/board" class="btn btn-ghost btn-sm mb-3 -ml-2"><i data-lucide="arrow-left" class="size-[1.2em]"></i>Board</a>
    <div class="flex flex-wrap items-center gap-3 mb-5">
      <h1 class="font-display text-4xl md:text-5xl break-words min-w-0">${esc(d.name)}</h1>
      <div class="flex flex-wrap gap-2">${badge(d.status)} ${overdueBadge(d)}</div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <section class="card bg-base-100 border border-base-300">
        <div class="card-body">
          <h2 class="card-title text-2xl"><i data-lucide="paw-print" class="size-5"></i>The dog</h2>
          <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-sm">
            <dt class="text-base-content/60">Breed</dt><dd>${esc(d.breed)}</dd>
            <dt class="text-base-content/60">Kennel</dt><dd><span class="badge badge-outline font-mono">${esc(d.kennel)}</span></dd>
            <dt class="text-base-content/60">Arrival</dt><dd class="tabular-nums">${esc(d.arrival)}</dd>
            <dt class="text-base-content/60">Owner</dt><dd>${esc(o.name)}</dd>
            <dt class="text-base-content/60">Phone</dt><dd class="tabular-nums">${esc(o.phone)}</dd>
          </dl>
        </div>
      </section>
      <section class="card bg-base-100 border border-base-300">
        <div class="card-body">
          <h2 class="card-title text-2xl"><i data-lucide="bed-double" class="size-5"></i>The stay</h2>
          ${st ? `
          <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-2 text-sm">
            <dt class="text-base-content/60">Check-in</dt><dd>${esc(when(st.checkIn))}</dd>
            <dt class="text-base-content/60">Planned check-out</dt><dd>${esc(when(st.plannedCheckOut))}</dd>
            <dt class="text-base-content/60">Nightly rate</dt><dd class="tabular-nums">${money(st.nightlyRate)}</dd>
            <dt class="text-base-content/60">Nights</dt><dd class="tabular-nums">${esc(st.nights)}</dd>
          </dl>
          <div class="divider my-1"></div>
          <div class="flex items-baseline justify-between gap-2">
            <span class="text-sm font-semibold uppercase tracking-wide text-base-content/70">Total due</span>
            <span data-total-due class="text-3xl font-semibold tabular-nums">${money(st.totalDue)}</span>
          </div>` : `<p class="text-base-content/60 italic">No stay on file for this dog.</p>`}
        </div>
      </section>
      <section class="card bg-base-100 border border-base-300">
        <div class="card-body">
          <h2 class="card-title text-2xl"><i data-lucide="list-checks" class="size-5"></i>Actions</h2>
          ${locked ? `<p class="text-sm text-base-content/70">The day is closed — stays are locked.</p>` : ""}
          <div class="flex flex-col sm:flex-row lg:flex-col flex-wrap gap-2">
            ${act("dog.checkIn", "Check in", "log-in", d.status === "booked", d.status === "booked")}
            ${act("dog.startWalk", "Start walk", "footprints", d.status === "checked-in")}
            ${act("dog.endWalk", "End walk", "house", d.status === "walking")}
            ${act("dog.checkOut", "Check out", "log-out", d.status === "checked-in", d.status === "checked-in")}
          </div>
        </div>
      </section>
      <section class="card bg-base-100 border border-base-300 lg:col-span-3">
        <div class="card-body">
          <h2 class="card-title text-2xl"><i data-lucide="notebook-pen" class="size-5"></i>Notes <span class="badge badge-sm">${d.notes.length}</span></h2>
          <ul class="divide-y divide-base-content/10">${notes}</ul>
          <form id="note-form" class="flex flex-col md:flex-row gap-2 mt-2">
            <input name="author" class="input md:w-48" value="Front desk" aria-label="Author" required />
            <input name="text" class="input md:flex-1 w-full" placeholder="Add a handling note…" aria-label="Note" required />
            <button class="btn btn-soft btn-secondary"><i data-lucide="plus" class="size-[1.2em]"></i>Add note</button>
          </form>
        </div>
      </section>
    </div>`;
  $app.querySelectorAll("[data-cmd]").forEach((b) => b.addEventListener("click", () => runStatus(d, b.dataset.cmd)));
  document.getElementById("note-form").addEventListener("submit", (e) => { e.preventDefault(); addNote(d, e.target); });
}

// instant feedback: render the intent first, reconcile on the reply, revert + toast on rejection.
const TARGET = { "dog.checkIn": "checked-in", "dog.startWalk": "walking", "dog.endWalk": "checked-in", "dog.checkOut": "checked-out" };
const failId = (id) => { if (!ui.failNext) return id; ui.failNext = false; document.getElementById("demo-fail").checked = false; return id + "-unreachable"; };

async function runStatus(d, cmd) {
  const before = { status: d.status };
  d.status = TARGET[cmd];
  render();
  try {
    const reply = await window.commands.run(cmd, { id: failId(d.id), status: TARGET[cmd] });
    Object.assign(d, reply);
  } catch (err) {
    Object.assign(d, before);
    toast(`${d.name}: ${STATUS[TARGET[cmd]].label.toLowerCase()} didn't go through — reverted.`);
  }
  render();
}

async function addNote(d, form) {
  const text = form.text.value.trim(), author = form.author.value.trim();
  if (!text) return;
  const temp = { id: "pending", text, author, pending: true };
  d.notes = [...d.notes, temp];
  render();
  try {
    const reply = await window.commands.run("dog.addNote", { id: failId(d.id), text, author });
    d.notes = d.notes.map((n) => (n === temp ? reply : n));
  } catch {
    d.notes = d.notes.filter((n) => n !== temp);
    render();
    document.querySelector('#note-form [name="text"]').value = text;
    toast(`Note for ${d.name} wasn't saved — it's back in the box.`);
    return;
  }
  render();
}

// ---------------------------------------------------------------------------
// Screen 3 — Day summary.
// ---------------------------------------------------------------------------
function renderSummary() {
  const { day, dog } = ui.data;
  const overdue = dog.filter((d) => d.overdue);   // server-decided flag — no date math here
  const byStatus = ORDER.map((s) => `
    <li class="flex items-center gap-3 py-2">
      <span class="w-32 shrink-0">${badge(s, "badge-sm")}</span>
      <progress class="progress ${s === "walking" ? "progress-accent" : s === "checked-in" ? "progress-success" : s === "booked" ? "progress-info" : ""} flex-1" value="${esc(day.byStatus[s])}" max="${esc(day.kennelsTotal)}"></progress>
      <span class="w-8 text-right tabular-nums font-semibold">${esc(day.byStatus[s])}</span>
    </li>`).join("");
  const overdueList = overdue.length === 0
    ? `<p class="text-base-content/60 italic py-3">No overdue pickups — every owner is on time.</p>`
    : `<ul class="divide-y divide-base-content/10">${overdue.map((d) => `
        <li class="py-3 flex flex-wrap items-center gap-2">
          <a href="#/dog/${esc(d.id)}" class="font-semibold link link-hover min-w-0 break-words">${esc(d.name)}</a>
          <span class="badge badge-outline font-mono">${esc(d.kennel)}</span>
          <span class="text-sm text-base-content/70 min-w-0">${esc(owner(d.owner).name)} · <span class="tabular-nums">${esc(owner(d.owner).phone)}</span></span>
          <span class="ml-auto">${overdueBadge(d)}</span>
        </li>`).join("")}</ul>`;
  $app.innerHTML = `
    <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div><h1 class="font-display text-4xl">Day summary</h1>
        <p class="text-base-content/70">${esc(dayLabel(day.date))}</p></div>
      ${day.closed
        ? `<span class="badge badge-neutral badge-lg"><i data-lucide="lock" class="size-[1em]"></i>Day closed</span>`
        : `<button id="close-day" class="btn btn-primary" ${ui.pendingClose ? "disabled" : ""}>
             ${ui.pendingClose ? `<span class="loading loading-spinner loading-sm"></span>Closing the day…` : `<i data-lucide="lock" class="size-[1.2em]"></i>Close the day`}
           </button>`}
    </div>
    ${day.closed ? `<div role="alert" class="alert alert-soft alert-success mb-5"><i data-lucide="circle-check" class="size-5 shrink-0"></i><span>Today's ledger is locked. Revenue below is final.</span></div>` : ""}
    <div class="stats stats-vertical md:stats-horizontal w-full bg-base-100 border border-base-300 mb-5">
      <div class="stat">
        <div class="stat-figure text-secondary"><i data-lucide="warehouse" class="size-8"></i></div>
        <div class="stat-title">Occupancy</div>
        <div class="stat-value tabular-nums">${esc(day.kennelsUsed)}<span class="text-base font-normal text-base-content/60"> of ${esc(day.kennelsTotal)} kennels</span></div>
        <div class="stat-desc"><progress class="progress progress-secondary w-40" value="${esc(day.occupancyPct)}" max="100"></progress> ${esc(day.occupancyPct)}%</div>
      </div>
      <div class="stat">
        <div class="stat-figure text-success"><i data-lucide="banknote" class="size-8"></i></div>
        <div class="stat-title">Revenue today</div>
        <div class="stat-value tabular-nums">${money(day.revenueToday)}</div>
        <div class="stat-desc">${day.closed ? "Final" : "Settles when the day closes"}</div>
      </div>
      <div class="stat">
        <div class="stat-figure text-error"><i data-lucide="alarm-clock" class="size-8"></i></div>
        <div class="stat-title">Overdue pickups</div>
        <div class="stat-value tabular-nums">${esc(day.overdueCount)}</div>
        <div class="stat-desc">Past their planned check-out</div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <section class="card bg-base-100 border border-base-300"><div class="card-body">
        <h2 class="card-title text-2xl"><i data-lucide="dog" class="size-5"></i>Dogs by status</h2>
        <ul>${byStatus}</ul>
      </div></section>
      <section class="card bg-base-100 border border-base-300"><div class="card-body">
        <h2 class="card-title text-2xl"><i data-lucide="alarm-clock" class="size-5"></i>Overdue pickups</h2>
        ${overdueList}
      </div></section>
    </div>`;
  const btn = document.getElementById("close-day");
  if (btn) btn.addEventListener("click", closeDay);
}

// confirmed feedback: pending state until the reply, then render the server's day.
async function closeDay() {
  ui.pendingClose = true;
  render();
  try {
    const reply = await window.commands.run("day.close", { id: failId(ui.data.day.id), closed: true });
    ui.data.day = { ...ui.data.day, ...reply };
    toast("Day closed — ledger locked.", "success");
  } catch {
    toast("The day couldn't be closed — nothing changed.");
  }
  ui.pendingClose = false;
  render();
}

// ---------------------------------------------------------------------------
// Router + wiring.
// ---------------------------------------------------------------------------
let loadState = "loading";
function render() {
  const [, view = "board", id] = (location.hash.replace(/^#\/?/, "") || "board").match(/^([^/]*)\/?(.*)$/) || [];
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("btn-active", a.dataset.nav === (view === "dog" ? "board" : view)));
  if (loadState === "loading") renderLoading();
  else if (loadState === "error") renderError();
  else if (view === "dog") renderDetail(id);
  else if (view === "summary") renderSummary();
  else renderBoard();
  lucide.createIcons();
}

async function setDemo(mode) {
  ui.demo = mode;
  document.getElementById("demo-state").value = mode;
  loadState = "loading";
  render();
  await new Promise((r) => setTimeout(r, mode === "loading" ? 0 : 450)); // fake latency
  try { loadState = await load(); } catch { loadState = "error"; }
  render();
}

$app.addEventListener("click", (e) => {
  const f = e.target.closest("[data-filter]");
  if (f) { ui.filter = f.dataset.filter === ui.filter && f.dataset.filter !== "all" ? "all" : f.dataset.filter; render(); }
});
document.getElementById("demo-state").addEventListener("change", (e) => setDemo(e.target.value));
document.getElementById("demo-fail").addEventListener("change", (e) => { ui.failNext = e.target.checked; });
const themeToggle = document.getElementById("theme-toggle");
const setTheme = (t) => { document.documentElement.dataset.theme = t; themeToggle.checked = t === "brand-dark"; };
themeToggle.addEventListener("change", () => setTheme(themeToggle.checked ? "brand-dark" : "brand"));
setTheme(params.get("theme") || "brand");
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
setDemo(ui.demo);
</script>
