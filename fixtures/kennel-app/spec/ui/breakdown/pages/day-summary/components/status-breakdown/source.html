<!-- region: #app section.card:has(h2 [data-lucide="dog"]) — live DOM at #/summary, open day, seed data, 1280px, theme brand; captured with Lucide stubbed so icons stay <i data-lucide> as authored -->
<section class="card bg-base-100 border border-base-300"><div class="card-body">
        <h2 class="card-title text-2xl"><i data-lucide="dog" class="size-5"></i>Dogs by status</h2>
        <ul>
    <li class="flex items-center gap-3 py-2">
      <span class="w-32 shrink-0"><span class="badge badge-info badge-soft badge-sm whitespace-nowrap"><i data-lucide="calendar-clock" class="size-[1em]"></i>Booked</span></span>
      <progress class="progress progress-info flex-1" value="7" max="40"></progress>
      <span class="w-8 text-right tabular-nums font-semibold">7</span>
    </li>
    <li class="flex items-center gap-3 py-2">
      <span class="w-32 shrink-0"><span class="badge badge-success badge-soft badge-sm whitespace-nowrap"><i data-lucide="house" class="size-[1em]"></i>Checked in</span></span>
      <progress class="progress progress-success flex-1" value="14" max="40"></progress>
      <span class="w-8 text-right tabular-nums font-semibold">14</span>
    </li>
    <li class="flex items-center gap-3 py-2">
      <span class="w-32 shrink-0"><span class="badge badge-accent badge-sm whitespace-nowrap"><i data-lucide="footprints" class="size-[1em]"></i>Walking</span></span>
      <progress class="progress progress-accent flex-1" value="5" max="40"></progress>
      <span class="w-8 text-right tabular-nums font-semibold">5</span>
    </li>
    <li class="flex items-center gap-3 py-2">
      <span class="w-32 shrink-0"><span class="badge badge-outline badge-sm whitespace-nowrap"><i data-lucide="log-out" class="size-[1em]"></i>Checked out</span></span>
      <progress class="progress  flex-1" value="6" max="40"></progress>
      <span class="w-8 text-right tabular-nums font-semibold">6</span>
    </li></ul>
      </div></section>
