<!-- Verbatim from spec/ui/kennel-prototype/_test-prototype.html lines 194-233 (region: body > header.navbar). Lucide <i data-lucide> become <svg class="lucide lucide-<name> ..."> at runtime. The .dropdown (flask, #demo-state/#demo-fail) is prototype harness, not product. -->
  <header class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-30 px-3 md:px-6 gap-2">
    <div class="flex-1 flex items-center gap-2 min-w-0">
      <i data-lucide="dog" class="size-6 text-primary shrink-0"></i>
      <a href="#/board" class="font-display text-2xl md:text-3xl truncate pr-2">Kennel board</a>
    </div>
    <nav class="flex items-center gap-1">
      <a href="#/board" data-nav="board" class="btn btn-ghost btn-sm">
        <i data-lucide="layout-grid" class="size-[1.2em]"></i><span class="hidden sm:inline">Board</span>
      </a>
      <a href="#/summary" data-nav="summary" class="btn btn-ghost btn-sm">
        <i data-lucide="chart-no-axes-column" class="size-[1.2em]"></i><span class="hidden sm:inline">Day summary</span>
      </a>
      <label class="swap swap-rotate btn btn-ghost btn-sm btn-square" title="Toggle theme">
        <input type="checkbox" id="theme-toggle" />
        <i data-lucide="sun" class="swap-off size-[1.2em]"></i>
        <i data-lucide="moon" class="swap-on size-[1.2em]"></i>
      </label>
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-sm btn-square" title="Demo states">
          <i data-lucide="flask-conical" class="size-[1.2em]"></i>
        </div>
        <div tabindex="0" class="dropdown-content z-40 mt-2 w-60 rounded-box bg-base-100 border border-base-300 shadow-sm p-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Demo states</legend>
            <select id="demo-state" class="select select-sm w-full">
              <option value="live">Live (seed data — 32 dogs)</option>
              <option value="empty">Empty — no dogs today</option>
              <option value="loading">Loading</option>
              <option value="error">Error — load failed</option>
            </select>
            <label class="label mt-2 cursor-pointer gap-2">
              <input type="checkbox" id="demo-fail" class="toggle toggle-sm toggle-error" />
              Next write fails
            </label>
            <p class="label text-xs whitespace-normal">A failing write rolls back and shows an error toast.</p>
          </fieldset>
        </div>
      </div>
    </nav>
  </header>
